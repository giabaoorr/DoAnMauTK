<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Tin Tức Đa Nguồn</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v='10.0')}">
</head>
<body class="vne-editorial-theme">

<!-- Header chung -->
<div th:replace="~{fragments/header :: header('login')}"></div>

<main class="container auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Đăng Nhập</h1>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${errorMessage != null}" class="alert-banner alert-warning" style="margin-bottom: 20px;">
            <div class="alert-content">
                <span th:text="${errorMessage}">Tên đăng nhập hoặc mật khẩu không đúng!</span>
            </div>
        </div>

        <!-- Thông báo thành công nếu có -->
        <div th:if="${message != null}" class="alert-banner alert-success" style="margin-bottom: 20px;">
            <div class="alert-content">
                <span th:text="${message}">Thao tác thành công!</span>
            </div>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form" id="loginForm">
            <input type="hidden" name="returnUrl" th:value="${returnUrl != null ? returnUrl : '/'}">

            <div class="form-group">
                <label for="usernameOrEmail" class="form-label">Tên đăng nhập hoặc Email:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-input"
                           th:value="${usernameOrEmail}"
                           placeholder="Nhập tên đăng nhập hoặc email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Nhập mật khẩu của bạn" required>
                </div>
            </div>

            <button type="submit" class="btn-auth-submit">Đăng Nhập Ngay</button>

            <div class="auth-footer-links">
                <span>Chưa có tài khoản?</span>
                <a th:href="@{/register}" class="auth-link">Đăng ký tài khoản mới</a>
            </div>
        </form>
    </div>
</main>

<!-- Footer chung -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
