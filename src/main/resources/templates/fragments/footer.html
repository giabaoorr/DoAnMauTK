<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="site-footer">
    <div class="container footer-content">
        <div class="footer-brand">
            <span class="footer-logo">NEWS READER</span>
            <p class="footer-desc">Ứng dụng Web đọc báo đa nguồn áp dụng chuẩn mực 6 Mẫu Thiết Kế GoF</p>
        </div>

        <div class="footer-patterns">
            <span class="patterns-title">6 Mẫu Thiết Kế (Pure Java):</span>
            <span class="pattern-tag">Factory Method</span>
            <span class="pattern-tag">Adapter</span>
            <span class="pattern-tag">Strategy</span>
            <span class="pattern-tag">Observer</span>
            <span class="pattern-tag">Decorator</span>
            <span class="pattern-tag">Singleton</span>
        </div>

        <p class="footer-copy">&copy; 2026 Đồ án môn Mẫu Thiết Kế • Chạy trên Spring Boot 3 &amp; Thymeleaf</p>
    </div>

    <!-- Nút cuộn nhanh lên đầu trang (Back to top) -->
    <button type="button" id="backToTopBtn" class="back-to-top" title="Cuộn lên đầu trang" aria-label="Lên đầu trang">
        <span>↑</span>
    </button>

    <!-- Hộp thông báo nhanh Toast Popup -->
    <div id="toastNotification" class="toast-popup" role="alert" aria-live="polite">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">Thông báo</span>
    </div>

    <!-- Script tương tác thân thiện người dùng (Vanilla JS) -->
    <script>
        // Đảm bảo luôn sử dụng giao diện sáng tiêu chuẩn báo chí
        (function() {
            localStorage.removeItem('theme');
            document.documentElement.removeAttribute('data-theme');

            const dateElem = document.getElementById('liveDateText');
            if (dateElem) {
                const now = new Date();
                const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
                const dayName = days[now.getDay()];
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                dateElem.textContent = dayName + ', ' + d + '/' + m + '/' + y;
            }
        })();

        // 2. Tìm kiếm thông minh thời gian thực với Highlight từ khóa (Live Search & Keyword Highlight)
        (function() {
            const searchInput = document.getElementById('liveSearchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            const filterForm = document.getElementById('filterForm');
            if (!searchInput) return;

            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            // Tiện ích loại bỏ dấu tiếng Việt để tìm kiếm không dấu ("dan tri" -> "dân trí")
            function removeVietnameseTones(str) {
                if (!str) return '';
                return str.normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
                    .toLowerCase();
            }

            function getArticleElements(card) {
                const titleLink = card.querySelector('.vne-hero-headline a, .vne-sub-headline a, .vne-stream-headline a, .card-title a, .vne-block-title a, .vne-bullet-link');
                const descElem = card.querySelector('.vne-hero-sapo, .vne-sub-sapo, .vne-stream-desc, .card-desc, .vne-block-desc');
                return { titleLink, descElem };
            }

            function performSearch(query) {
                const trimmed = query.trim();
                const lowerQuery = trimmed.toLowerCase();
                const normQuery = removeVietnameseTones(trimmed);

                if (clearBtn) {
                    clearBtn.style.display = trimmed ? 'block' : 'none';
                }

                // Tất cả các thẻ bài viết trên trang (Tiêu điểm, Luồng tin chính, Khối chuyên mục)
                const streamCards = document.querySelectorAll('.vne-stream-card, .article-card');
                const spotlightCards = document.querySelectorAll('.vne-col-hero, .vne-col-sub');
                const blockCards = document.querySelectorAll('.vne-block-featured, .vne-bullet-item');
                const spotlightSection = document.querySelector('.vne-top-spotlight');

                let matchCount = 0;
                let spotlightMatchCount = 0;

                function processCard(card, isSpotlight) {
                    const { titleLink, descElem } = getArticleElements(card);
                    if (!titleLink) return;

                    if (!titleLink.dataset.originalTitle) {
                        titleLink.dataset.originalTitle = titleLink.textContent;
                    }
                    const rawTitle = titleLink.dataset.originalTitle || titleLink.textContent;
                    const rawDesc = descElem ? descElem.textContent : '';

                    const titleLower = rawTitle.toLowerCase();
                    const descLower = rawDesc.toLowerCase();
                    const titleNorm = removeVietnameseTones(rawTitle);
                    const descNorm = removeVietnameseTones(rawDesc);

                    const isMatch = !trimmed
                        || titleLower.includes(lowerQuery)
                        || descLower.includes(lowerQuery)
                        || (normQuery && (titleNorm.includes(normQuery) || descNorm.includes(normQuery)));

                    if (isMatch) {
                        card.style.display = '';
                        matchCount++;
                        if (isSpotlight) spotlightMatchCount++;

                        // Tô sáng (Highlight) từ khóa khớp trong tiêu đề bài viết
                        if (trimmed) {
                            try {
                                const regex = new RegExp('(' + escapeRegExp(trimmed) + ')', 'gi');
                                titleLink.innerHTML = rawTitle.replace(regex, '<mark class="search-highlight">$1</mark>');
                            } catch (err) {
                                titleLink.textContent = rawTitle;
                            }
                        } else {
                            titleLink.textContent = rawTitle;
                        }
                    } else {
                        card.style.display = 'none';
                        titleLink.textContent = rawTitle;
                    }
                }

                // 1. Lọc luồng bài viết chính
                streamCards.forEach(card => processCard(card, false));

                // 2. Lọc 3 bài viết tiêu điểm hàng đầu
                spotlightCards.forEach(card => processCard(card, true));
                if (spotlightSection) {
                    if (trimmed && spotlightMatchCount === 0) {
                        spotlightSection.style.display = 'none';
                    } else {
                        spotlightSection.style.display = '';
                    }
                }

                // 3. Lọc các bài viết trong khối chuyên mục (nếu có)
                blockCards.forEach(card => processCard(card, false));

                // 4. Cập nhật thông báo số lượng bài viết tìm thấy
                const searchCounter = document.getElementById('searchResultCount');
                if (searchCounter) {
                    if (trimmed) {
                        searchCounter.textContent = '(' + matchCount + ' bài viết khớp)';
                        searchCounter.style.color = '#9f224e';
                        searchCounter.style.fontWeight = 'bold';
                    } else {
                        searchCounter.style.color = '';
                        searchCounter.style.fontWeight = '';
                    }
                }

                // 5. Hiển thị hộp thông báo trống nếu không tìm thấy bài nào
                let emptyNotice = document.getElementById('liveSearchEmptyNotice');
                const streamList = document.querySelector('.vne-stream-list');
                if (trimmed && matchCount === 0) {
                    if (!emptyNotice && streamList && streamList.parentNode) {
                        emptyNotice = document.createElement('div');
                        emptyNotice.id = 'liveSearchEmptyNotice';
                        emptyNotice.className = 'vne-empty-box';
                        emptyNotice.innerHTML = `
                            <h4 style="color:#9f224e;">Không tìm thấy bài viết nào</h4>
                            <p>Không có bài viết nào khớp với từ khóa "<strong>${trimmed}</strong>". Vui lòng thử từ khóa khác hoặc xóa tìm kiếm.</p>
                            <button type="button" id="btnResetLiveSearch" class="btn-vne-apply" style="cursor:pointer; margin-top:8px;">Xóa tìm kiếm</button>
                        `;
                        streamList.parentNode.insertBefore(emptyNotice, streamList.nextSibling);
                        const resetBtn = document.getElementById('btnResetLiveSearch');
                        if (resetBtn) {
                            resetBtn.addEventListener('click', function() {
                                if (clearBtn) clearBtn.click();
                            });
                        }
                    }
                    if (emptyNotice) emptyNotice.style.display = 'block';
                } else if (emptyNotice) {
                    emptyNotice.style.display = 'none';
                }
            }

            // Lắng nghe sự kiện gõ phím thời gian thực (Live Search)
            searchInput.addEventListener('input', function() {
                performSearch(this.value);
            });

            // Khi người dùng bấm Enter: cho phép submit form để Strategy Pattern phía Server xử lý
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (filterForm) {
                        filterForm.submit();
                    }
                }
            });

            // Nút Xóa từ khóa (Clear Search)
            if (clearBtn) {
                clearBtn.addEventListener('click', function() {
                    searchInput.value = '';
                    // Nếu đang có tham số ?keyword= trên URL thì chuyển về trang không có keyword
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('keyword')) {
                        urlParams.delete('keyword');
                        const newQuery = urlParams.toString();
                        window.location.href = window.location.pathname + (newQuery ? '?' + newQuery : '');
                    } else {
                        performSearch('');
                        searchInput.focus();
                    }
                });
            }

            // Khi trang vừa tải: nếu đã có từ khóa (từ URL/Server), thực hiện highlight ngay
            if (searchInput.value && searchInput.value.trim() !== '') {
                performSearch(searchInput.value);
            }
        })();

        // 3. Nút cuộn lên đầu trang (Back to Top)
        (function() {
            const btn = document.getElementById('backToTopBtn');
            if (!btn) return;

            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });

            btn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();

        // 4. Hàm hiển thị Toast Popup
        function showToast(message, icon) {
            const toast = document.getElementById('toastNotification');
            const msgSpan = document.getElementById('toastMessage');
            const iconSpan = document.getElementById('toastIcon');
            if (!toast || !msgSpan) return;

            msgSpan.textContent = message;
            if (icon && iconSpan) iconSpan.textContent = icon;
            toast.classList.add('show');

            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // 5. Tự động hiển thị Toast nếu có thông báo từ Spring Boot Flash Attributes
        (function() {
            /*[# th:if="${message != null}"]*/
            const serverMsg = /*[[${message}]]*/ '';
            if (serverMsg) {
                const icon = serverMsg.includes('Đã lưu') ? '🔖' : (serverMsg.includes('Đã gỡ') ? '🗑️' : '✨');
                setTimeout(() => showToast(serverMsg, icon), 150);
            }
            /*[/]*/
        })();

        // 6. Xử lý Đánh dấu / Bỏ đánh dấu bài viết tức thì (AJAX Bookmark & Toast Notification)
        (function() {
            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (!form || !form.action || !form.action.includes('/bookmarks/toggle')) return;

                e.preventDefault();

                const formData = new FormData(form);
                const articleId = formData.get('articleId');
                if (!articleId) {
                    form.submit();
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) submitBtn.disabled = true;

                fetch('/api/bookmarks/toggle?articleId=' + encodeURIComponent(articleId), {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        // Cập nhật trạng thái tất cả các nút của bài viết này trên trang
                        const sameArticleForms = document.querySelectorAll('form[action*="/bookmarks/toggle"]');
                        sameArticleForms.forEach(f => {
                            const fId = f.querySelector('input[name="articleId"]');
                            if (fId && fId.value === articleId) {
                                const btn = f.querySelector('button[type="submit"]');
                                if (btn) {
                                    if (data.bookmarked) {
                                        btn.classList.add('saved');
                                        btn.title = 'Đã lưu (Bấm để bỏ lưu)';
                                    } else {
                                        btn.classList.remove('saved');
                                        btn.title = 'Lưu bài viết';
                                    }
                                }
                            }
                        });

                        // Cập nhật con số hiển thị trên Header (badge số lượng tin đã lưu)
                        const counters = document.querySelectorAll('.nav-counter');
                        counters.forEach(c => {
                            c.textContent = data.count;
                        });

                        // Nếu đang ở trang danh sách bài viết đã lưu (/bookmarks) và vừa gỡ bỏ tin:
                        if (window.location.pathname.includes('/bookmarks') && !data.bookmarked) {
                            const card = form.closest('.article-card, .vne-stream-card, .bookmark-item, .vne-bookmark-card');
                            if (card) {
                                card.style.transition = 'all 0.3s ease';
                                card.style.opacity = '0';
                                card.style.transform = 'scale(0.96)';
                                setTimeout(() => card.remove(), 300);
                            }
                        }

                        // Hiển thị Toast thông báo nổi bật
                        const icon = data.bookmarked ? '🔖' : '🗑️';
                        showToast(data.message, icon);
                    } else {
                        form.submit();
                    }
                })
                .catch(err => {
                    console.error('AJAX bookmark error, fallback to form submit', err);
                    form.submit();
                })
                .finally(() => {
                    if (submitBtn) submitBtn.disabled = false;
                });
            });
        })();

        // 5. Nút sao chép liên kết bài viết
        function copyArticleLink(url, event) {
            if (event) event.preventDefault();
            const fullUrl = url.startsWith('http') ? url : window.location.origin + url;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    showToast('Đã sao chép liên kết vào bộ nhớ tạm!', '📋');
                }).catch(() => {
                    promptCopy(fullUrl);
                });
            } else {
                promptCopy(fullUrl);
            }
        }

        function promptCopy(text) {
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = text;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast('Đã sao chép liên kết!', '📋');
        }

        // 6. Điều chỉnh cỡ chữ trang đọc tin (Font Size Adjuster)
        (function() {
            const bodyElem = document.getElementById('articleBodyContent');
            if (!bodyElem) return;

            let currentSize = parseInt(localStorage.getItem('articleFontSize') || '17');
            applyFontSize(currentSize);

            const decBtn = document.getElementById('fontDecBtn');
            const incBtn = document.getElementById('fontIncBtn');
            const resetBtn = document.getElementById('fontResetBtn');

            if (decBtn) {
                decBtn.addEventListener('click', () => {
                    if (currentSize > 14) {
                        currentSize -= 1.5;
                        applyFontSize(currentSize);
                    }
                });
            }
            if (incBtn) {
                incBtn.addEventListener('click', () => {
                    if (currentSize < 24) {
                        currentSize += 1.5;
                        applyFontSize(currentSize);
                    }
                });
            }
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    currentSize = 17;
                    applyFontSize(currentSize);
                });
            }

            function applyFontSize(size) {
                bodyElem.style.fontSize = size + 'px';
                localStorage.setItem('articleFontSize', size);
                const label = document.getElementById('fontSizeLabel');
                if (label) label.textContent = size + 'px';
            }
        })();
    </script>
</footer>
</html>
