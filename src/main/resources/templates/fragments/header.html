<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header(activePage)" class="site-header">
    <div class="container header-content">
        <a th:href="@{/}" class="logo-area" title="Về trang chủ">
            <span class="logo-badge">NEWS</span>
            <div class="site-title">
                <span class="site-title-main">Tin Tức Đa Nguồn</span>
                <span class="site-subtitle">Đồ án Mẫu Thiết Kế (Design Patterns)</span>
            </div>
        </a>

        <!-- Thanh tìm kiếm nhanh trên Header -->
        <div class="header-search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="liveSearchInput" class="header-search-input"
                   placeholder="Tìm nhanh bài viết, từ khóa..."
                   aria-label="Tìm kiếm bài viết">
            <button type="button" id="clearSearchBtn" class="search-clear-btn" style="display:none;" title="Xóa tìm kiếm">✕</button>
        </div>

        <nav class="header-actions">
            <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'home'} ? 'active' : ''">
                <span>📰 Trang chủ</span>
            </a>
            <a th:href="@{/(featured='true')}" class="nav-link nav-link-featured" th:classappend="${activePage == 'featured'} ? 'active' : ''" title="Xem danh sách bài viết nổi bật (FeaturedArticle Decorator)">
                <span>⭐ Nổi bật</span>
            </a>
            <a th:href="@{/bookmarks}" class="nav-link" th:classappend="${activePage == 'bookmarks'} ? 'active' : ''" title="Bài viết đã lưu (BookmarkedArticle Decorator)">
                <span>🔖 Đã lưu</span>
                <span th:if="${bookmarkCount != null and bookmarkCount > 0}"
                      class="nav-counter"
                      th:text="${bookmarkCount}">0</span>
            </a>

            <!-- Nút đổi giao diện Sáng / Tối (Dark Mode) -->
            <button type="button" id="themeToggleBtn" class="btn-theme-toggle" title="Chuyển chế độ Sáng / Tối" aria-label="Đổi giao diện">
                <span id="themeToggleIcon">🌙</span>
            </button>

            <!-- Nút làm mới dữ liệu (Observer Pattern) -->
            <form th:action="@{/refresh}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-primary btn-sm btn-refresh" title="Làm mới tin tức từ các nguồn RSS [Observer Pattern]">
                    <span class="refresh-icon">🔄</span>
                    <span class="refresh-text">Làm mới</span>
                </button>
            </form>
        </nav>
    </div>
</header>
</html>
