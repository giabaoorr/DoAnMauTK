<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Tin Tức Đa Nguồn</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v='10.0')}">
</head>
<body class="vne-editorial-theme">

<!-- Header chung -->
<div th:replace="~{fragments/header :: header('register')}"></div>

<main class="container auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${errorMessage != null}" class="alert-banner alert-warning" style="margin-bottom: 20px;">
            <div class="alert-content">
                <span th:text="${errorMessage}">Vui lòng kiểm tra lại thông tin nhập!</span>
            </div>
        </div>

        <form th:action="@{/register}" method="post" class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="fullName" class="form-label">Họ và tên:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="fullName" name="fullName" class="form-input"
                           th:value="${fullName}"
                           placeholder="Ví dụ: Nguyễn Văn A" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Tên đăng nhập (Username):</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" class="form-input"
                           th:value="${username}"
                           placeholder="Tối thiểu 3 ký tự, không dấu, không cách" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Địa chỉ Email:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" class="form-input"
                           th:value="${email}"
                           placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Tối thiểu 6 ký tự" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu:</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </span>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                           placeholder="Nhập lại chính xác mật khẩu ở trên" required>
                </div>
            </div>

            <button type="submit" class="btn-auth-submit">Đăng Ký Tài Khoản</button>

            <div class="auth-footer-links">
                <span>Đã có tài khoản?</span>
                <a th:href="@{/login}" class="auth-link">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</main>

<!-- Footer chung -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
